<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap">
<title>تقرير نتيجة مرحباً</title>

<style>
/* Layout: form on top, A4-like report preview below; report stays dark+gold in both themes */
:root{--bg:#f6f4ef;--fg:#1c1a14;--muted:#6b6658;--card:#fff;--line:#e2ddd0;--gold:#b8901f;--ink:#0d0d0f;--paper:#0f0e0a;--paper-fg:#f4ecd8;--paper-mute:#b9ae92;--paper-gold:#D4AF37;--paper-card:#1a170d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--fg:#f1ede2;--muted:#a49f90;--card:#17171c;--line:#2a2a31;--gold:#D4AF37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e11;--fg:#f1ede2;--muted:#a49f90;--card:#17171c;--line:#2a2a31;--gold:#D4AF37;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;font-size:15px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:800}
.lead{color:var(--muted);margin:0 0 18px;line-height:1.7;font-size:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.form textarea{resize:vertical;min-height:64px}
.form input:focus,.form textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.tip{font-size:12.5px;color:var(--muted);margin:12px 2px 16px;line-height:1.7}
.paper{background:var(--paper);color:var(--paper-fg);border-radius:6px;padding:26px 22px 22px;border:2px solid var(--paper-gold);position:relative;aspect-ratio:210/297;display:flex;flex-direction:column;overflow:hidden}
.paper::before{content:"";position:absolute;inset:7px;border:1px solid rgba(212,175,55,.35);border-radius:3px;pointer-events:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph img{width:84px;height:auto;display:block}
.ph .kind{text-align:left;font-size:11px;color:var(--paper-mute);line-height:1.6}
.ph .kind b{display:block;color:var(--paper-gold);font-size:13px}
.ptitle{margin:14px 0 2px;font-size:22px;font-weight:900;color:var(--paper-gold);line-height:1.25}
.psub{font-size:12.5px;color:var(--paper-mute);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--paper-card);border:1px solid rgba(212,175,55,.3);border-radius:10px;padding:10px 10px 9px;text-align:center;min-width:0}
.stat .n{font-size:28px;font-weight:900;color:var(--paper-gold);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--paper-mute);margin-top:2px}
.offer{margin-top:10px;background:var(--paper-card);border-inline-start:3px solid var(--paper-gold);border-radius:6px;padding:8px 11px;font-size:12.5px;line-height:1.7}
.offer small{display:block;color:var(--paper-mute);font-size:11px}
.quote{margin-top:10px;font-size:13px;line-height:1.8;padding:0 4px}
.quote i{display:block;margin-top:3px;font-style:normal;color:var(--paper-gold);font-size:12px;font-weight:700}
.pf{margin-top:auto;padding-top:10px;border-top:1px solid rgba(212,175,55,.35);font-size:11px;color:var(--paper-mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pf b{color:var(--paper-gold)}
.note{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.8;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
[hidden]{display:none!important}
.btn{flex:1;font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}.btn.gold{background:var(--gold);color:#14110a;border-color:var(--gold)}
</style>
<div class="wrap">
  <h1>تقرير نتيجة مرحباً NFC</h1>
  <p class="lead">اكتبي أرقام تجربة البراند، وتتغير الصفحة أدناه مباشرة. بعد الانتهاء صوّريها بلقطة شاشة وأرسليها لصاحب البراند أو ضميها لملفك.</p>

  <div class="form">
    <label class="full">اسم البراند<input id="brand" value="كرانشي كورنر" autocomplete="off"></label>
    <label>اسم الفعالية<input id="event" value="بازار نبض" autocomplete="off"></label>
    <label>التاريخ<input id="date" value="٢٠٢٦/١١/٢٦" autocomplete="off"></label>
    <label>عدد المسحات<input id="scans" inputmode="numeric" value="120"></label>
    <label>أشخاص فريدون (اختياري)<input id="uniq" inputmode="numeric" value="85"></label>
    <label>نقرات واتساب<input id="wa" inputmode="numeric" value="34"></label>
    <label>مسجّلون في السحب<input id="draw" inputmode="numeric" value="41"></label>
    <label class="full">العرض أو السحب في الصفحة<input id="offer" value="عرض محدود على كاسات الذرة بالصوصات المميزة"></label>
    <label class="full">رأي صاحب البراند (اختياري)<textarea id="quote">التجربة سهّلت علينا نعرف كم شخص اهتم بعرضنا.</textarea></label>
    <label class="full">اسم صاحب الرأي<input id="who" value="صاحبة البراند"></label>
  </div>
  <p class="tip">الأرقام أعلاه أمثلة للتجربة فقط، فاستبدليها بأرقامك الحقيقية من التطبيق. لا تكتبي رقماً غير صحيح، فالجهات قد تتحقق منه.</p>
